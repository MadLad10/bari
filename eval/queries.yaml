  query: "2-bed near BRAC under 25k, women-only, safe area, from January"
  expected:
    listings: [11]
    tools: [check_availability]
    args: {bedrooms: 2, max_price: 25000, is_female_only: true, nearby_university: BRAC University}
  retrieval: {sources: [listing], filters: {bedrooms: 2, max_price: 25000, is_female_only: true, nearby_university: BRAC University}}

